name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Change to 'master' if your default branch is master

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage clean web files
        run: |
          mkdir -p _site
          
          # Copy project files to _site while automatically excluding all archive, ebook, and ontology_ref folders anywhere in the repo
          rsync -av --progress . _site/ \
            --exclude 'archive' \
            --exclude 'ebook' \
            --exclude 'ontology_ref' \
            --exclude '.git' \
            --exclude '.github'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4