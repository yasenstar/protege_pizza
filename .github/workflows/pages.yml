name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage and Convert README to HTML
        run: |
          mkdir -p _site
          
          # Install lightweight markdown converter
          pip install -q markdown
          
          # Convert README.md into index.html wrapped in GitHub Markdown CSS
          python3 -c "
          import markdown
          with open('README.md', 'r', encoding='utf-8') as f:
              text = f.read()
          html = markdown.markdown(text, extensions=['fenced_code', 'tables', 'nl2br'])
          page = f'''<!DOCTYPE html>
          <html lang=\"en\">
          <head>
              <meta charset=\"utf-8\">
              <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">
              <title>Mastering Ontology Engineering with Protégé and Pizza.owl</title>
              <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-min.css\">
              <style>
                  body {{ box-sizing: border-box; min-width: 200px; max-width: 980px; margin: 0 auto; padding: 45px; }}
                  @media (max-width: 767px) {{ body {{ padding: 15px; }}}}
              </style>
          </head>
          <body class=\"markdown-body\">
              {html}
          </body>
          </html>'''
          with open('_site/index.html', 'w', encoding='utf-8') as f:
              f.write(page)
          "
          
          # Copy remaining necessary assets while excluding heavy folders and staging directory
          rsync -av --progress . _site/ \
            --exclude '_site' \
            --exclude 'archive' \
            --exclude 'ebook' \
            --exclude 'ontology_ref' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'README.md'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4